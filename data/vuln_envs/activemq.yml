name: activemq
description: Apache ActiveMQ Classic with Jolokia API

variants:
  - name: "5.18.6"
    version: "5.18.6"
    image: docker.io/apache/activemq-classic:5.18.6
    default: true

shared:
  ports:
    web: 8161
    broker: 61616

  credentials:
    default:
      username: admin
      password: admin

  datastore_defaults:
    TARGETURI: /

  health_check:
    type: http
    path: /api/jolokia/
    expected_status: 200
    interval: 5
    timeout: 2
    retries: 12
    credentials:
      username: admin
      password: admin

  ci:
    exploit:
      payload: java/meterpreter/reverse_tcp
      options:
        LHOST: 127.0.0.1
        LPORT: 4444
    validation:
      expected_session: true
      session_type: meterpreter
      expected_output: "uid="
      timeout: 120

profiles:
  default:
    description: Standard Apache ActiveMQ with web console and broker
