name: activemq
description: Apache ActiveMQ Classic with Jolokia API

versions:
  "5.18.6":
    image: apache/activemq-classic:5.18.6

shared:
  ports:
    web: 8161
    broker: 61616

  credentials:
    default:
      username: admin
      password: admin

  datastore_defaults:
    TARGETURI: /api/jolokia/

  health_check:
    type: http
    path: /api/jolokia/
    expected_status: 200
    interval: 5
    timeout: 2
    retries: 12

  ci:
    exploit:
      payload: java/meterpreter/reverse_tcp
      options:
        LHOST: 127.0.0.1
        LPORT: 4444
    validation:
      expected_session: true
      session_type: meterpreter
      expected_output: "uid="
      timeout: 120

profiles:
  default:
    description: Standard ActiveMQ with web console and broker
