name: wordpress
description: Vulnerable WordPress installation for security testing

variants:
  - name: "latest"
    version: "4.9"
    image: docker.io/eystsen/vulnerablewordpress
    default: true

shared:
  ports:
    http: 80

  credentials:
    default:
      username: admin
      password: admin

  datastore_defaults:
    TARGETURI: /

  health_check:
    type: http
    path: /
    expected_status: 302
    interval: 3
    timeout: 2
    retries: 10

  ci:
    exploit:
      payload: php/meterpreter/reverse_tcp
      options:
        LHOST: 127.0.0.1
        LPORT: 4444
    validation:
      expected_session: true
      session_type: meterpreter
      expected_output: "uid="
      timeout: 120

profiles:
  default:
    description: Standard vulnerable WordPress
